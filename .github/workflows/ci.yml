name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure compiler cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos-15-full

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DRADIXFORGE_WERROR=ON

      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  unit-asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure unit tests with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >-
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DRADIXFORGE_UNIT_TESTS_ONLY=ON -DRADIXFORGE_BUILD_TOOLS=OFF
          -DRADIXFORGE_WERROR=ON -DRADIXFORGE_SANITIZE=address,undefined

      - name: Build unit tests
        run: cmake --build build-asan -j 2

      - name: Test unit tests
        run: ctest --test-dir build-asan --output-on-failure

  unit-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure unit tests with ThreadSanitizer
        run: >-
          cmake -B build-tsan -DCMAKE_BUILD_TYPE=Debug
          -DRADIXFORGE_UNIT_TESTS_ONLY=ON -DRADIXFORGE_BUILD_TOOLS=OFF
          -DRADIXFORGE_WERROR=ON -DRADIXFORGE_SANITIZE=thread

      - name: Build unit tests
        run: cmake --build build-tsan -j 2

      - name: Test unit tests
        run: ctest --test-dir build-tsan --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Check C++ formatting
        run: >-
          find src include test tools fuzz -type f \( -name '*.cpp' -o -name '*.h' \) -print0 |
          xargs -0 uvx clang-format==18.1.8 --dry-run --Werror

      - name: Check Python lint and formatting
        run: |
          uvx ruff check scripts/
          uvx ruff format --check scripts/

  e2e-determinism:
    needs: build-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download tiny GGUF model
        run: >-
          curl --fail --location --retry 3 --retry-all-errors
          --output /tmp/stories260K.gguf
          https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf

      - name: Configure
        run: >-
          cmake -B build-e2e -DCMAKE_BUILD_TYPE=Release -DRADIXFORGE_WERROR=ON
          -DRADIXFORGE_E2E_MODEL=/tmp/stories260K.gguf

      - name: Build server
        run: cmake --build build-e2e --target radixforge -j "$(sysctl -n hw.ncpu)"

      - name: Run deterministic cache test
        run: ctest --test-dir build-e2e --output-on-failure -R '^e2e_determinism$'

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Put the matching LLVM tools on PATH
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libclang-rt-18-dev
          dirname "$(readlink -f "$(command -v clang)")" >> "$GITHUB_PATH"

      - name: Configure fuzzers with Clang
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -B build-fuzz -DCMAKE_BUILD_TYPE=Debug
          -DRADIXFORGE_UNIT_TESTS_ONLY=ON -DRADIXFORGE_BUILD_TOOLS=OFF
          -DRADIXFORGE_FUZZ=ON -DRADIXFORGE_WERROR=ON

      - name: Build fuzzers
        run: cmake --build build-fuzz --target fuzz_json fuzz_openai_request -j 2

      - name: Fuzz JSON parser
        run: build-fuzz/fuzz/fuzz_json fuzz/corpus -max_total_time=60

      - name: Fuzz OpenAI request parser
        run: build-fuzz/fuzz/fuzz_openai_request fuzz/corpus -max_total_time=60

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Put the matching LLVM tools on PATH
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libclang-rt-18-dev
          dirname "$(readlink -f "$(command -v clang)")" >> "$GITHUB_PATH"

      - name: Configure coverage build with Clang
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -B build-coverage -DCMAKE_BUILD_TYPE=Debug
          -DRADIXFORGE_UNIT_TESTS_ONLY=ON -DRADIXFORGE_BUILD_TOOLS=OFF
          -DRADIXFORGE_COVERAGE=ON -DRADIXFORGE_WERROR=ON

      - name: Build and test coverage targets
        env:
          LLVM_PROFILE_FILE: coverage-%p.profraw
        run: |
          cmake --build build-coverage -j 2
          ctest --test-dir build-coverage --output-on-failure

      - name: Generate coverage summary and HTML report
        run: |
          find build-coverage -name '*.profraw' -print0 | xargs -0 llvm-profdata merge -sparse \
            -o build-coverage/coverage.profdata
          binaries=(build-coverage/test/test_radix_tree build-coverage/test/test_kv_mapper build-coverage/test/test_openai_api)
          for binary in "${binaries[@]}"; do
            llvm-cov report "$binary" -instr-profile=build-coverage/coverage.profdata \
              --ignore-filename-regex='(vendor|test)/'
          done | tee build-coverage/coverage.txt
          llvm-cov show "${binaries[0]}" -instr-profile=build-coverage/coverage.profdata \
            "${binaries[@]:1}" --format=html --output-dir=build-coverage/coverage-html \
            --ignore-filename-regex='(vendor|test)/'
          {
            echo '## Unit-test coverage'
            echo '```text'
            cat build-coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce per-file line coverage thresholds
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          thresholds = {
              "src/radix_tree.cpp": 78.0,
              "src/kv_mapper.cpp": 70.0,
              "src/openai_api.cpp": 82.0,
          }
          report = Path("build-coverage/coverage.txt").read_text()
          failures = []
          for filename, threshold in thresholds.items():
              match = re.search(
                  rf"{re.escape(filename)}\s+\d+\s+\d+\s+[\d.]+%\s+\d+\s+\d+\s+[\d.]+%\s+\d+\s+\d+\s+([\d.]+)%",
                  report,
              )
              if match is None:
                  failures.append(f"missing coverage result for {filename}")
              elif float(match.group(1)) < threshold:
                  failures.append(
                      f"{filename}: {match.group(1)}% below {threshold:.1f}% line threshold"
                  )
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: build-coverage/coverage-html
